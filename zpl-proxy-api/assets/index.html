<html>
<head>
	<title>ZPL Print Preview</title>
</head>

<body>
	<h1>ZPL Print Preview</h1>
	<textarea id="zpl" rows="10" cols="50">
		^XA
		^FO50,50
		^A0N50,50
		^FDHello, World!^FS
		^XZ
	</textarea>

	<button id="print">Print</button>
	<p id="error" role="alert"></p>

	<img id="image" />

	<script>
		const zpl = document.getElementById('zpl');
		const print = document.getElementById('print');
		const image = document.getElementById('image');
		const error = document.getElementById('error');
		let imageUrl;

		print.addEventListener('click', async function() {
			print.disabled = true;
			error.textContent = '';
			try {
				const response = await fetch("/api/zpl-zd621", {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
						'Accept': 'image/png',
					},
					body: JSON.stringify({ zpl: zpl.value }),
				});
				if (!response.ok) {
					throw new Error(`Preview failed (${response.status})`);
				}
				const nextUrl = URL.createObjectURL(await response.blob());
				image.src = nextUrl;
				if (imageUrl) URL.revokeObjectURL(imageUrl);
				imageUrl = nextUrl;
			} catch (cause) {
				error.textContent = cause.message;
			} finally {
				print.disabled = false;
			}
		});

		
	</script>
</body>
</html>
