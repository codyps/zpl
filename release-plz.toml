# https://release-plz.dev/docs/config
[workspace]
repo_url = "https://github.com/codyps/zpl"
# Track published crates.io versions; the workflow runs release-pr only.
git_only = false
# If a release job is added later, require a merged release PR first.
release_always = false
# Release preparation must not also perform unrelated dependency upgrades.
dependencies_update = false
pr_name = "chore: prepare release"
