# https://release-plz.dev/docs/config
[workspace]
repo_url = "https://github.com/codyps/zpl"
# The renderer and its runtime font/raster dependencies are public crates.
release = false
# Track published crates.io versions when preparing the next release PR.
git_only = false
# Publish only on a release PR merge, not on ordinary commits to main.
release_always = false
# Each managed crate gets a crates.io version, git tag, and GitHub release.
publish = true
git_tag_enable = true
git_release_enable = true
# Release preparation must not also perform unrelated dependency upgrades.
dependencies_update = false
# PR creation runs after update + scripts/bindings-release.py; its branch/title
# are configured in release-plz.yml so all ecosystems appear in one PR.

[[package]]
name = "raster-diff"
release = true

[[package]]
name = "zpl-bitmap-fonts"
release = true

[[package]]
name = "zpl"
release = true

# Name placeholder only; Python releases are built from zpl-python, not this crate.
[[package]]
name = "zplkit"
release = false
publish = false
