[package]
name = "zpl-c"
version = "0.3.2"
edition = "2021"
license.workspace = true
publish = false
description = "C bindings for the local ZPL parser and renderer"
repository = "https://github.com/codyps/zpl"
readme = "README.md"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# cargo-c identifies C-library packages by this feature; it adds no code.
# https://github.com/lu-zero/cargo-c#the-tldr
capi = []

[dependencies]
zpl = { version = "0.3.2", path = "../zpl" }

# cargo-c (`cargo cbuild`/`cinstall`) installs the library, headers and a
# pkg-config file. Keys: https://github.com/lu-zero/cargo-c/blob/v0.10.26/docs/configuration.md
[package.metadata.capi]
min_version = "0.10.26"

[package.metadata.capi.header]
# include/zpl.h and include/zpl_config.h are maintained (and checked by
# generate-config.py), not generated by cbindgen; install them unchanged.
generation = false
name = "zpl"
subdirectory = "zpl"

[package.metadata.capi.install.include]
# Glob assets install under {includedir}/{to}, not the header subdirectory, so
# `to` repeats it to match the generated pkg-config `-I${includedir}/zpl`.
asset = [{ from = "include/*.h", to = "zpl" }]

[package.metadata.capi.library]
name = "zpl_c"
# The shared-library version follows the C ABI (ZPL_ABI_VERSION), not the crate
# version, so the SONAME changes exactly when the ABI does. tests/c_api.rs checks
# that this major version equals zpl_abi_version().
version = "4.0.0"

[dev-dependencies]
cc = "1.4.7"
tempfile = "3.27.0"
