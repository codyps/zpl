# Build/test jobs never receive the Hex publishing credential.
name: Elixir distributions

on:
  workflow_call:
    inputs:
      version:
        description: Completed stable renderer version; empty for ordinary CI
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  CARGO_NET_RETRY: 2
  CARGO_HTTP_TIMEOUT: 30
  HEX_HTTP_TIMEOUT: 30
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  native:
    name: NIF ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            library: libzpl_elixir.so
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            library: libzpl_elixir.so
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            library: libzpl_elixir.dylib
          - runner: macos-15
            target: aarch64-apple-darwin
            library: libzpl_elixir.dylib
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            library: zpl_elixir.dll
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.18'
          otp-version: '28'
      - run: mix local.hex 2.5.1 --force
      - name: Stamp completed renderer version
        if: inputs.version != ''
        run: python scripts/elixir-release.py stamp "$RELEASE_VERSION"
      - name: Materialize license files on Windows
        if: runner.os == 'Windows'
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          for crate in ("zpl-elixir", "zpl", "zpl-bitmap-fonts", "raster-diff"):
              path = Path(crate) / "LICENSE"
              path.unlink()
              path.write_bytes(Path("LICENSE").read_bytes())
          PYTHON
      - name: Build and package native library
        env:
          NIF_TARGET: ${{ matrix.target }}
          NIF_LIBRARY: ${{ matrix.library }}
        run: |
          cargo build --locked --release -p zpl_elixir --target "$NIF_TARGET"
          python scripts/elixir-prebuilt.py pack "$NIF_TARGET" "target/$NIF_TARGET/release/$NIF_LIBRARY" dist
          cargo fetch --locked
          python scripts/elixir-package.py "$RUNNER_TEMP/elixir-native"
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("zpl-elixir/Cargo.toml", "rb"))["package"]["version"])')
          python scripts/elixir-prebuilt.py checksums "$VERSION" dist "$RUNNER_TEMP/elixir-native" --target "$NIF_TARGET"
      - name: Test prebuilt download and consumer release without Rust
        run: python scripts/elixir-consumer.py "$RUNNER_TEMP/elixir-native" --artifacts dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: elixir-nif-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  package:
    needs: native
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            elixir: '1.15'
            otp: '25'
          - runner: ubuntu-24.04
            elixir: '1.18'
            otp: '28'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - run: mix local.hex 2.5.1 --force
      - name: Stamp completed renderer version
        if: inputs.version != ''
        run: python3 scripts/elixir-release.py stamp "$RELEASE_VERSION"
      - name: Check native binding
        run: cargo clippy --locked -p zpl_elixir --all-targets -- -D warnings
      - name: Test checkout
        working-directory: zpl-elixir
        run: |
          mix deps.get
          mix format --check-formatted
          mix test
          git diff --exit-code -- mix.lock
      - name: Stage portable source package
        run: python3 scripts/elixir-package.py zpl-elixir/_package
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: elixir-nif-*
          merge-multiple: true
          path: prebuilt
      - name: Pin checksums for every supported target
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("zpl-elixir/Cargo.toml", "rb"))["package"]["version"])')
          python3 scripts/elixir-prebuilt.py checksums "$VERSION" prebuilt zpl-elixir/_package
      - name: Build Hex archive
        working-directory: zpl-elixir/_package
        run: |
          mix deps.get
          mkdir -p "$GITHUB_WORKSPACE/dist"
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          mix hex.build --output "$GITHUB_WORKSPACE/dist/zpl-$VERSION.tar"
      - name: Test unpacked archive outside the checkout
        env:
          ZPL_BUILD: 'true'
        run: |
          mkdir "$RUNNER_TEMP/elixir-unpacked"
          tar -xOf dist/zpl-*.tar contents.tar.gz | tar -xz -C "$RUNNER_TEMP/elixir-unpacked"
          cd "$RUNNER_TEMP/elixir-unpacked"
          mix deps.get
          mix test
          cargo check --locked -p zpl_elixir

      - name: Test archive consumer with and without prebuilts
        run: |
          python3 scripts/elixir-consumer.py "$RUNNER_TEMP/elixir-unpacked" --artifacts prebuilt
          python3 scripts/elixir-consumer.py "$RUNNER_TEMP/elixir-unpacked" --artifacts prebuilt --force-build
          python3 scripts/elixir-consumer.py "$RUNNER_TEMP/elixir-unpacked" --artifacts prebuilt --corrupt
          python3 scripts/elixir-consumer.py zpl-elixir

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.otp == '28'
        with:
          name: elixir-source
          path: dist/*.tar
          if-no-files-found: error
          retention-days: 14
