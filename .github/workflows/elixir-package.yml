# Build/test jobs never receive the Hex publishing credential.
name: Elixir distributions

on:
  workflow_call:
    inputs:
      version:
        description: Completed stable renderer version; empty for ordinary CI
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  CARGO_NET_RETRY: 2
  CARGO_HTTP_TIMEOUT: 30
  HEX_HTTP_TIMEOUT: 30
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  native:
    name: NIF ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            consumer: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            consumer: true
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: ubuntu-22.04
            target: arm-unknown-linux-gnueabihf
          - runner: ubuntu-22.04
            target: riscv64gc-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            consumer: true
          - runner: macos-15
            target: aarch64-apple-darwin
            consumer: true
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            consumer: true
          - runner: windows-2025
            target: x86_64-pc-windows-gnu
            consumer: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.18'
          otp-version: '28'
      - run: mix local.hex 2.5.1 --force
      - name: Stamp completed renderer version
        if: inputs.version != ''
        run: python scripts/elixir-release.py stamp "$RELEASE_VERSION"
      - name: Materialize license files on Windows
        if: runner.os == 'Windows'
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          for crate in ("zpl-elixir", "zpl", "zpl-bitmap-fonts", "raster-diff"):
              path = Path(crate) / "LICENSE"
              path.unlink()
              path.write_bytes(Path("LICENSE").read_bytes())
          PYTHON
      - name: Select MinGW linker
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: echo 'C:/msys64/mingw64/bin' >> "$GITHUB_PATH"
      - name: Read stamped package version
        id: version
        run: |
          python - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("zpl-elixir/Cargo.toml").read_text())["package"]["version"]
          print(f"version={version}")
          PYTHON
      # https://github.com/philss/rustler_precompiled/blob/v0.9.0/PRECOMPILATION_GUIDE.md
      # Run at the workspace root so the action finds Cargo's target directory.
      - name: Install portable Linux build tools
        if: runner.os == 'Linux'
        run: python -m pip install --retries 2 --timeout 30 'cargo-zigbuild==0.23.4' 'ziglang==0.14.1'
      - name: Build portable Linux NIF
        if: runner.os == 'Linux'
        env:
          NIF_TARGET: ${{ matrix.target }}
          NIF_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python scripts/native-build.py zpl_elixir "$NIF_TARGET" "$RUNNER_TEMP/libzpl_elixir.so"
          python scripts/elixir-prebuilt.py pack "$NIF_VERSION" "$NIF_TARGET" "$RUNNER_TEMP/libzpl_elixir.so" dist
      - name: Build precompiled NIF
        if: runner.os != 'Linux'
        id: build-crate
        uses: philss/rustler-precompiled-action@67ed0cc2d6a423e4c4cd9ad651dcc6c90f802cdb # v1.1.5
        with:
          project-name: zpl_elixir
          project-version: ${{ steps.version.outputs.version }}
          project-dir: .
          target: ${{ matrix.target }}
          nif-version: '2.15'
          # Native runners need no cross. The action's default string "false" is truthy.
          use-cross: ''
          cargo-args: --locked -p zpl_elixir
      - name: Stage native artifact and portable sources
        env:
          NIF_ARCHIVE: ${{ steps.build-crate.outputs.file-path }}
          NIF_TARGET: ${{ matrix.target }}
          NIF_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          if [ -n "$NIF_ARCHIVE" ]; then mv "$NIF_ARCHIVE" dist/; fi
      - name: Stage native consumer
        if: matrix.consumer == true
        env:
          NIF_TARGET: ${{ matrix.target }}
          NIF_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$NIF_TARGET" == *windows-gnu ]]; then export TARGET_ABI=gnu; fi
          cargo fetch --locked
          python scripts/elixir-package.py "$RUNNER_TEMP/elixir-native"
          python scripts/elixir-prebuilt.py checksums "$NIF_VERSION" dist "$RUNNER_TEMP/elixir-native" --target "$NIF_TARGET"
      - name: Test prebuilt download and consumer release without Rust
        if: matrix.consumer == true
        env:
          NIF_TARGET: ${{ matrix.target }}
        run: |
          if [[ "$NIF_TARGET" == *windows-gnu ]]; then export TARGET_ABI=gnu; fi
          python scripts/elixir-consumer.py "$RUNNER_TEMP/elixir-native" --artifacts dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: elixir-nif-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  package:
    needs: native
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            elixir: '1.15'
            otp: '25'
          - runner: ubuntu-24.04
            elixir: '1.18'
            otp: '28'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - run: mix local.hex 2.5.1 --force
      - name: Stamp completed renderer version
        if: inputs.version != ''
        run: python3 scripts/elixir-release.py stamp "$RELEASE_VERSION"
      - name: Check native binding
        run: cargo clippy --locked -p zpl_elixir --all-targets -- -D warnings
      - name: Test checkout
        working-directory: zpl-elixir
        run: |
          mix deps.get
          mix format --check-formatted
          mix test
          git diff --exit-code -- mix.lock
      - name: Stage portable source package
        run: python3 scripts/elixir-package.py zpl-elixir/_package
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: elixir-nif-*
          merge-multiple: true
          path: prebuilt
      - name: Pin checksums for every supported target
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("zpl-elixir/Cargo.toml", "rb"))["package"]["version"])')
          python3 scripts/elixir-prebuilt.py checksums "$VERSION" prebuilt zpl-elixir/_package
      - name: Build Hex archive
        working-directory: zpl-elixir/_package
        run: |
          mix deps.get
          mkdir -p "$GITHUB_WORKSPACE/dist"
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          mix hex.build --output "$GITHUB_WORKSPACE/dist/zpl-$VERSION.tar"
      - name: Test unpacked archive outside the checkout
        env:
          ZPL_BUILD: 'true'
        run: |
          mkdir "$RUNNER_TEMP/elixir-unpacked"
          tar -xOf dist/zpl-*.tar contents.tar.gz | tar -xz -C "$RUNNER_TEMP/elixir-unpacked"
          cd "$RUNNER_TEMP/elixir-unpacked"
          mix deps.get
          mix test
          cargo check --locked -p zpl_elixir

      - name: Build HexDocs from the unpacked archive
        env:
          ZPL_BUILD: 'true'
        run: |
          cd "$RUNNER_TEMP/elixir-unpacked"
          mix docs --warnings-as-errors --formatter html
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          python3 "$GITHUB_WORKSPACE/scripts/elixir-release.py" build-docs "$VERSION" doc "$GITHUB_WORKSPACE/dist/zpl-$VERSION-docs.tar.gz"

      - name: Test archive consumer with and without prebuilts
        run: |
          python3 scripts/elixir-consumer.py "$RUNNER_TEMP/elixir-unpacked" --artifacts prebuilt
          python3 scripts/elixir-consumer.py "$RUNNER_TEMP/elixir-unpacked" --artifacts prebuilt --force-build
          python3 scripts/elixir-consumer.py "$RUNNER_TEMP/elixir-unpacked" --artifacts prebuilt --corrupt
          python3 scripts/elixir-consumer.py zpl-elixir

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.otp == '28'
        with:
          name: elixir-source
          path: dist/*.tar
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.otp == '28'
        with:
          name: elixir-docs
          path: dist/*-docs.tar.gz
          if-no-files-found: error
          retention-days: 14

  alpine:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: elixir-source
          path: elixir-dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: elixir-nif-*
          merge-multiple: true
          path: prebuilt
      - name: Load musl NIF and run release on Alpine without Rust
        run: |
          mkdir alpine-package
          tar -xOf elixir-dist/zpl-*.tar contents.tar.gz | tar -xz -C alpine-package
          docker run --rm -v "$PWD:/work" -w /work elixir:1.18-alpine sh -ec '
            apk add --no-cache python3
            mix local.hex 2.5.1 --force
            python3 scripts/elixir-consumer.py alpine-package --artifacts prebuilt
          '

  foreign-consumer:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/arm/v7, linux/riscv64]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm,riscv64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: elixir-source
          path: elixir-dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: elixir-nif-*
          merge-multiple: true
          path: prebuilt
      - name: Test ARM and RISC-V prebuilt download and release without Rust
        env:
          CONSUMER_PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir consumer-package
          tar -xOf elixir-dist/zpl-*.tar contents.tar.gz | tar -xz -C consumer-package
          docker run --rm --platform "$CONSUMER_PLATFORM" -v "$PWD:/work" -w /work debian:trixie-slim sh -ec '
            apt-get -o Acquire::Retries=2 update
            apt-get -o Acquire::Retries=2 install -y --no-install-recommends ca-certificates elixir erlang-dev python3
            mix local.hex 2.5.1 --force
            python3 scripts/elixir-consumer.py consumer-package --artifacts prebuilt
          '
