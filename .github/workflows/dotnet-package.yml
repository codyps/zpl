# Build and test without a publishing identity; publication lives in release-plz.yml.
name: .NET package

on:
  workflow_call:
    inputs:
      version:
        description: Completed renderer release, or empty for ordinary CI
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  CARGO_NET_RETRY: 2
  CARGO_HTTP_TIMEOUT: 30
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            rid: linux-x64
            target: x86_64-unknown-linux-gnu
            library: libzpl_c.so
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
            target: aarch64-unknown-linux-gnu
            library: libzpl_c.so
          - runner: ubuntu-22.04
            rid: linux-arm
            target: armv7-unknown-linux-gnueabihf
            library: libzpl_c.so
          - runner: ubuntu-22.04
            rid: linux-musl-x64
            target: x86_64-unknown-linux-musl
            library: libzpl_c.so
          - runner: ubuntu-24.04-arm
            rid: linux-musl-arm64
            target: aarch64-unknown-linux-musl
            library: libzpl_c.so
          - runner: ubuntu-22.04
            rid: linux-musl-arm
            target: armv7-unknown-linux-musleabihf
            library: libzpl_c.so
          - runner: macos-15-intel
            rid: osx-x64
            target: x86_64-apple-darwin
            library: libzpl_c.dylib
          - runner: macos-15
            rid: osx-arm64
            target: aarch64-apple-darwin
            library: libzpl_c.dylib
          - runner: windows-2025
            rid: win-x64
            target: x86_64-pc-windows-msvc
            library: zpl_c.dll
          - runner: windows-2025
            rid: win-x86
            target: i686-pc-windows-msvc
            library: zpl_c.dll
          - runner: windows-11-arm
            rid: win-arm64
            target: aarch64-pc-windows-msvc
            library: zpl_c.dll
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install portable Linux build tools
        if: runner.os == 'Linux'
        run: python -m pip install --retries 2 --timeout 30 'cargo-zigbuild==0.23.4' 'ziglang==0.14.1'
      - name: Build and stage native C ABI
        env:
          NATIVE_RID: ${{ matrix.rid }}
          NATIVE_TARGET: ${{ matrix.target }}
          NATIVE_LIBRARY: ${{ matrix.library }}
        run: python scripts/native-build.py zpl-c "$NATIVE_TARGET" "zpl-dotnet/native/$NATIVE_RID/native/$NATIVE_LIBRARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-native-${{ matrix.rid }}
          path: zpl-dotnet/native/
          if-no-files-found: error
          retention-days: 14

  pack:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dotnet-native-*
          path: zpl-dotnet/native
          merge-multiple: true
      - name: Verify layouts and synchronized versions
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 zpl-c/generate-config.py --check
          python3 zpl-dotnet/generate-config.py --check
          python3 - <<'PYTHON'
          import os, sys, tomllib
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import importlib
          release = importlib.import_module('dotnet-release')
          root = Path.cwd()
          version = tomllib.loads(Path('zpl/Cargo.toml').read_text())['package']['version']
          assert release.project_version(root) == version
          assert tomllib.loads(Path('zpl-c/Cargo.toml').read_text())['package']['version'] == version
          assert not os.environ['RELEASE_VERSION'] or os.environ['RELEASE_VERSION'] == version
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)
          PYTHON
      - name: Pack and verify complete distribution
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet pack zpl-dotnet/Codyps.Zpl/Codyps.Zpl.csproj -c Release -o dist
          python3 scripts/dotnet-release.py verify "$PACKAGE_VERSION" "dist/Codyps.Zpl.$PACKAGE_VERSION.nupkg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-package
          path: dist/*.nupkg
          if-no-files-found: error
          retention-days: 14

  consumer:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
          - runner: ubuntu-22.04
            rid: linux-arm
            image: mcr.microsoft.com/dotnet/runtime:8.0-bookworm-slim
            docker-platform: linux/arm/v7
          - runner: ubuntu-22.04
            rid: linux-musl-x64
            image: mcr.microsoft.com/dotnet/runtime:8.0-alpine
            docker-platform: linux/amd64
          - runner: ubuntu-24.04-arm
            rid: linux-musl-arm64
            image: mcr.microsoft.com/dotnet/runtime:8.0-alpine
            docker-platform: linux/arm64
          - runner: ubuntu-22.04
            rid: linux-musl-arm
            image: mcr.microsoft.com/dotnet/runtime:8.0-alpine
            docker-platform: linux/arm/v7
          - runner: macos-15-intel
            rid: osx-x64
          - runner: macos-15
            rid: osx-arm64
          - runner: windows-2025
            rid: win-x64
          - runner: windows-2025
            rid: win-x86
          - runner: windows-11-arm
            rid: win-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.x
            6.0.x
      - name: Install x86 .NET SDK for a real 32-bit consumer
        if: matrix.rid == 'win-x86'
        shell: pwsh
        run: |
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile "$env:RUNNER_TEMP/dotnet-install.ps1" -MaximumRetryCount 2
          & "$env:RUNNER_TEMP/dotnet-install.ps1" -Channel 8.0 -Architecture x86 -InstallDir "$env:RUNNER_TEMP/dotnet-x86"
          & "$env:RUNNER_TEMP/dotnet-install.ps1" -Channel 6.0 -Architecture x86 -InstallDir "$env:RUNNER_TEMP/dotnet-x86"
          "$env:RUNNER_TEMP/dotnet-x86" >> $env:GITHUB_PATH
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        if: matrix.docker-platform == 'linux/arm/v7'
        with:
          platforms: arm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotnet-package
          path: dist
      - name: Run installed package and published application
        env:
          PACKAGE_VERSION: ${{ needs.pack.outputs.version }}
          NATIVE_RID: ${{ matrix.rid }}
          CONSUMER_IMAGE: ${{ matrix.image }}
          CONSUMER_PLATFORM: ${{ matrix.docker-platform }}
        run: |
          if [ -n "$CONSUMER_IMAGE" ]; then
            python zpl-dotnet/check-package.py dist "$PACKAGE_VERSION" "$NATIVE_RID" --container "$CONSUMER_IMAGE" --docker-platform "$CONSUMER_PLATFORM"
          else
            python zpl-dotnet/check-package.py dist "$PACKAGE_VERSION" "$NATIVE_RID"
            python zpl-dotnet/check-package.py dist "$PACKAGE_VERSION" "$NATIVE_RID" --framework net6.0
          fi

  framework:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        framework: [net472, net48]
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
      - uses: NuGet/setup-nuget@d105a947828025cd7a980103c35ba2bfae586d0f # v2
        with:
          nuget-version: '7.9.0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotnet-package
          path: dist
      - name: Test Framework package references, transitive references, and packages.config
        env:
          PACKAGE_VERSION: ${{ needs.pack.outputs.version }}
          TARGET_FRAMEWORK: ${{ matrix.framework }}
        run: |
          python zpl-dotnet/check-package.py dist "$PACKAGE_VERSION" win-x64 --framework "$TARGET_FRAMEWORK"
          python zpl-dotnet/check-framework.py dist "$PACKAGE_VERSION" --framework "$TARGET_FRAMEWORK"
