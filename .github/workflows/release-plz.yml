# PR-only setup: https://release-plz.dev/docs/github/quickstart
name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  CARGO_NET_RETRY: 2
  CARGO_HTTP_TIMEOUT: 30

jobs:
  release-pr:
    if: github.repository == 'codyps/zpl' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Create or update release PR
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release-pr
          version: 0.3.169
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
