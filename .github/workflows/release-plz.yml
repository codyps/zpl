# Native trusted publishing: https://release-plz.dev/docs/github/quickstart
name: Release-plz

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  CARGO_NET_RETRY: 2
  CARGO_HTTP_TIMEOUT: 30
  npm_config_fetch_retries: 2
  npm_config_fetch_timeout: 30000

jobs:
  release:
    if: github.repository == 'codyps/zpl' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    # Never interrupt a publish between the registry upload and tag/release creation.
    concurrency:
      group: release-plz-release
      cancel-in-progress: false
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends build-essential cmake pkg-config libssl-dev libsqlite3-dev gh jq
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Publish crates and create GitHub releases
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release
          version: 0.3.169
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Leave CARGO_REGISTRY_TOKEN unset: release-plz obtains a short-lived
          # crates.io token through GitHub OIDC only when publication is needed.

  npm-release:
    needs: release
    if: github.repository == 'codyps/zpl' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: release-npm
      cancel-in-progress: false
    steps:
      - name: Check out the release commit and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select completed renderer release and set npm version
        id: renderer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/npm-release.py >> "$GITHUB_OUTPUT"
      - name: Install Node
        if: steps.renderer.outputs.released == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check whether this npm version is already published
        if: steps.renderer.outputs.released == 'true'
        id: registry
        env:
          RELEASE_VERSION: ${{ steps.renderer.outputs.version }}
        run: |
          if npm view "@codyps/zpl@$RELEASE_VERSION" version --json > "$RUNNER_TEMP/npm-version.json"; then
            jq -e --arg version "$RELEASE_VERSION" '. == $version' "$RUNNER_TEMP/npm-version.json"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            # Only a missing version permits publishing; network/auth errors fail.
            jq -e '.error.code == "E404"' "$RUNNER_TEMP/npm-version.json"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install native build dependencies
        if: steps.registry.outputs.publish == 'true'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends build-essential cmake pkg-config libssl-dev
      - name: Install Rust and Wasm target
        if: steps.registry.outputs.publish == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install WebAssembly bindings CLI
        if: steps.registry.outputs.publish == 'true'
        timeout-minutes: 15
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - name: Build and test npm package
        if: steps.registry.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.renderer.outputs.version }}
        run: |
          cargo test --locked -p zpl-wasm
          npm run build --prefix zpl-node
          npm test --prefix zpl-node
          node -e 'require("node:assert/strict").equal(require("./zpl-node/index.cjs").libraryVersion(), process.env.RELEASE_VERSION)'
      - name: Publish npm package with trusted publishing
        if: steps.registry.outputs.publish == 'true'
        working-directory: zpl-node
        # Build/tests above include an installed-archive test. Avoid rebuilding.
        # No NODE_AUTH_TOKEN: https://docs.npmjs.com/trusted-publishers/
        run: npm publish --access public --ignore-scripts

  python-version:
    needs: release
    if: github.repository == 'codyps/zpl' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      released: ${{ steps.renderer.outputs.released }}
      version: ${{ steps.renderer.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select completed renderer release
        id: renderer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/python-release.py prepare >> "$GITHUB_OUTPUT"

  python-build:
    needs: python-version
    if: needs.python-version.outputs.released == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/python-package.yml
    with:
      version: ${{ needs.python-version.outputs.version }}

  python-release:
    needs: [python-version, python-build]
    # Ordinary commits have no build matrix but must let release-pr continue.
    if: >-
      !cancelled() && needs.python-version.result == 'success' &&
      (needs.python-version.outputs.released != 'true' || needs.python-build.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: release-pypi
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.python-version.outputs.released == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.python-version.outputs.released == 'true'
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - name: Select missing distributions for safe partial-release retries
        if: needs.python-version.outputs.released == 'true'
        id: registry
        env:
          RELEASE_VERSION: ${{ needs.python-version.outputs.version }}
        run: python3 scripts/python-release.py select-uploads "$RELEASE_VERSION" dist upload >> "$GITHUB_OUTPUT"
      - name: Publish to PyPI with trusted publishing
        if: steps.registry.outputs.publish == 'true'
        # No API token; publisher must match codyps/zpl and release-plz.yml.
        # https://docs.pypi.org/trusted-publishers/using-a-publisher/
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: upload/

  elixir-version:
    needs: release
    if: github.repository == 'codyps/zpl' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      released: ${{ steps.renderer.outputs.released }}
      version: ${{ steps.renderer.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select completed renderer release
        id: renderer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/elixir-release.py prepare >> "$GITHUB_OUTPUT"

  elixir-build:
    needs: elixir-version
    if: needs.elixir-version.outputs.released == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/elixir-package.yml
    with:
      version: ${{ needs.elixir-version.outputs.version }}

  elixir-release:
    needs: [elixir-version, elixir-build]
    if: >-
      !cancelled() && needs.elixir-version.result == 'success' &&
      (needs.elixir-version.outputs.released != 'true' || needs.elixir-build.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-hex
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.elixir-version.outputs.released == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.elixir-version.outputs.released == 'true'
        with:
          name: elixir-source
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.elixir-version.outputs.released == 'true'
        with:
          pattern: elixir-nif-*
          merge-multiple: true
          path: prebuilt
      - name: Upload immutable NIF assets before publishing Hex metadata
        if: needs.elixir-version.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.elixir-version.outputs.version }}
        run: python3 scripts/elixir-prebuilt.py publish "$RELEASE_VERSION" prebuilt
      - name: Publish tested archive to Hex
        if: needs.elixir-version.outputs.released == 'true'
        # Hex 2.5.1 supports API keys; native OIDC is not yet in a stable release.
        # https://hex.pm/docs/publish#publishing-from-ci
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          RELEASE_VERSION: ${{ needs.elixir-version.outputs.version }}
        run: python3 scripts/elixir-release.py publish "$RELEASE_VERSION" "dist/zpl-$RELEASE_VERSION.tar"

  go-release:
    needs: release
    if: github.repository == 'codyps/zpl' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: release-go
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select completed renderer release
        id: renderer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/go-release.py prepare >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: steps.renderer.outputs.released == 'true'
        with:
          go-version: '1.27.2'
          cache-dependency-path: zpl-go/go.sum
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action, pinned compiler for generated artifacts
        if: steps.renderer.outputs.released == 'true'
        with:
          toolchain: '1.98.1'
          targets: wasm32-unknown-unknown
      - name: Verify committed artifacts and test standalone Go package
        if: steps.renderer.outputs.released == 'true'
        run: |
          python3 zpl-go/generate.py --check
          python3 zpl-go/check_package.py
      - name: Publish immutable Go tag and register with the public proxy
        if: steps.renderer.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/go-release.py publish

  release-pr:
    # Use published versions only after every publisher succeeds.
    needs: [release, npm-release, python-release, elixir-release, go-release]
    if: >-
      !cancelled() && github.repository == 'codyps/zpl' && github.ref == 'refs/heads/main' &&
      needs.release.result == 'success' && needs.npm-release.result == 'success' &&
      needs.python-release.result == 'success' && needs.elixir-release.result == 'success' &&
      needs.go-release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends build-essential cmake pkg-config libssl-dev libsqlite3-dev gh jq
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action, pinned compiler for generated artifacts
        with:
          toolchain: '1.98.1'
          targets: wasm32-unknown-unknown
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache-dependency-path: zpl-go/go.sum
      # release-plz calculates Rust versions first. Binding packages are outside
      # its registry comparison, so finish the local edits before opening one PR.
      - name: Install release preparation tools
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: release-plz@0.3.169,cargo-semver-checks@0.50.0
      - name: Calculate Rust releases
        env:
          GIT_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: release-plz update
      - name: Include binding releases and synchronize versions
        run: |
          python3 scripts/bindings-release.py --body "$RUNNER_TEMP/release-pr.md"
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          git diff --check
      - name: Regenerate Go artifacts for the prepared renderer
        run: |
          if ! git diff --quiet -- zpl/Cargo.toml; then
            python3 zpl-go/generate.py
            python3 zpl-go/check_package.py
          fi
      - name: Create or update release PR
        # https://github.com/peter-evans/create-pull-request#usage
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
          branch: release-plz-auto
          base: main
          title: "chore: prepare release"
          commit-message: |
            chore: prepare release

            Prepare Rust and binding versions from changes since the previous releases.
            Keep binding packages aligned with the renderer for registry publication.
          body-path: ${{ runner.temp }}/release-pr.md
          add-paths: |
            Cargo.lock
            **/Cargo.toml
            **/CHANGELOG.md
            zpl-node/package.json
            zpl-elixir/mix.exs
            zpl-go/guest.wasm
            zpl-go/internal/translated/module.go
            zpl-go/internal/translated/module.dat
            zpl-go/generated.json
