# PR-only setup: https://release-plz.dev/docs/github/quickstart
name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release-pr:
    if: github.repository == 'codyps/zpl' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Create or update release PR
        uses: release-plz/action@8e61445f0b34e7c6d985255f2f1f05a36eb350dc # v0.5
        with:
          command: release-pr
          version: 0.3.167
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
