# https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
name: Preview website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_NET_RETRY: 2
  CARGO_HTTP_TIMEOUT: 30
  npm_config_fetch_retries: 2
  npm_config_fetch_timeout: 30000
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install WebAssembly bindings CLI
        timeout-minutes: 15
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - name: Test browser adapter
        run: cargo test --locked -p zpl-wasm
      - name: Build static site
        run: bash scripts/build-site.sh
      - name: Test compiled WebAssembly
        run: node --test site/tests/wasm.test.mjs
      - name: Install browser test dependencies
        timeout-minutes: 5
        working-directory: site
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test browser preview
        timeout-minutes: 5
        working-directory: site
        run: npm test
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.repository == 'codyps/zpl' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          timeout: 300000
