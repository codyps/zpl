# https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
name: Preview website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: [Publish rendering benchmarks]
    types: [completed]
permissions:
  contents: read
# One combined artifact owns both / and /perf/; neither deployment can erase the other.
concurrency:
  # Even a skipped workflow can cancel another run sharing its concurrency group.
  # Ignore unsuccessful publisher completions without touching a production build.
  group: pages-${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && github.run_id || github.ref }}
  # Benchmark publication refreshes the same commit: let its push checks finish
  # before rebuilding with the new history. New pushes still supersede old builds.
  # https://docs.github.com/en/actions/concepts/workflows-and-actions/concurrency
  cancel-in-progress: ${{ github.event_name != 'workflow_run' }}
env:
  CARGO_NET_RETRY: 2
  CARGO_HTTP_TIMEOUT: 30
  npm_config_fetch_retries: 2
  npm_config_fetch_timeout: 30000
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends build-essential cmake pkg-config libssl-dev
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      - name: Install WebAssembly bindings CLI
        timeout-minutes: 15
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - name: Test browser adapter
        run: cargo test --locked -p zpl-wasm
      - name: Build static site
        run: bash scripts/build-site.sh
      - name: Assemble performance dashboard and latest history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s benchmarks -p 'test_*.py' -v
          node --test benchmarks/dashboard.test.mjs
          history_ref=$(git -c 'credential.helper=!gh auth git-credential' ls-remote --heads origin benchmarks)
          if [ -n "$history_ref" ]; then
            git -c 'credential.helper=!gh auth git-credential' fetch --depth=1 origin refs/heads/benchmarks
            git archive FETCH_HEAD data | tar -x -C _site/perf
          fi
      - name: Test compiled WebAssembly
        run: node --test site/tests/wasm.test.mjs
      - name: Install browser test dependencies
        timeout-minutes: 5
        working-directory: site
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test browser preview
        timeout-minutes: 5
        working-directory: site
        run: npm test
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preview-browser-screenshots
          path: site/test-results/*.png
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.repository == 'codyps/zpl' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 300000
