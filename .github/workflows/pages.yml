# https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
name: Preview website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: [Publish rendering benchmarks]
    types: [completed]
permissions:
  contents: read
# One combined artifact owns both / and /perf/; neither deployment can erase the other.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true
env:
  CARGO_NET_RETRY: 2
  CARGO_HTTP_TIMEOUT: 30
  npm_config_fetch_retries: 2
  npm_config_fetch_timeout: 30000
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: warbler-linux
    timeout-minutes: 30
    environment: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'warbler-cache-main' || 'warbler-cache-read' }}
    env:
      WARBLER_CACHE_CREDENTIAL: ${{ secrets.WARBLER_CACHE_WRITE || secrets.WARBLER_CACHE_READ }}
    steps:
      - name: Install checkout dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends git gh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Warbler creates a fresh Ubuntu cloud VM for every job.
      - name: Install native build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends build-essential cmake pkg-config libssl-dev
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Configure Warbler compiler cache
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/mozilla/sccache/releases/download/v0.18.0/sccache-v0.18.0-x86_64-unknown-linux-musl.tar.gz \
            --output "$RUNNER_TEMP/sccache.tar.gz"
          echo "45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89  $RUNNER_TEMP/sccache.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/sccache.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/sccache-v0.18.0-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 .github/scripts/warbler_cache.py
      - name: Install WebAssembly bindings CLI
        timeout-minutes: 15
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - name: Test browser adapter
        run: cargo test --locked -p zpl-wasm
      - name: Build static site
        run: bash scripts/build-site.sh
      - name: Assemble performance dashboard and latest history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s benchmarks -p 'test_*.py' -v
          node --test benchmarks/dashboard.test.mjs
          history_ref=$(git -c 'credential.helper=!gh auth git-credential' ls-remote --heads origin benchmarks)
          if [ -n "$history_ref" ]; then
            git -c 'credential.helper=!gh auth git-credential' fetch --depth=1 origin refs/heads/benchmarks
            git archive FETCH_HEAD data | tar -x -C _site/perf
          fi
      - name: Test compiled WebAssembly
        run: node --test site/tests/wasm.test.mjs
      - name: Install browser test dependencies
        timeout-minutes: 5
        working-directory: site
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test browser preview
        timeout-minutes: 5
        working-directory: site
        run: npm test
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preview-browser-screenshots
          path: site/test-results/*.png
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: _site
      - name: Compiler cache statistics
        if: always() && env.RUSTC_WRAPPER == 'sccache'
        run: sccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"
  deploy:
    if: github.repository == 'codyps/zpl' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: warbler-linux
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 300000
