# https://docs.github.com/en/actions/use-cases-and-examples/building-and-testing/building-and-testing-rust
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_RETRY: 2
  CARGO_HTTP_TIMEOUT: 30

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-shell:
    name: Cache Nix development shell (${{ matrix.system }})
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: warbler-linux
          - system: x86_64-darwin
            runner: warbler-macos-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check Cachix credentials
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo '::error::Set the CACHIX_AUTH_TOKEN repository secret to a Cachix write token for codyps.'
            exit 1
          fi
      - name: Install checkout dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            download-attempts = 3
            connect-timeout = 15
            stalled-download-timeout = 60
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: codyps
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Push only the shell closure explicitly, including substituted paths.
          # https://github.com/cachix/cachix-action#push-modes
          skipPush: true
      - name: Build development shell
        # The profile retains the environment and its dependencies for upload.
        # https://nix.dev/manual/nix/2.28/command-ref/new-cli/nix3-develop.html
        env:
          NIX_SHELL_SYSTEM: ${{ matrix.system }}
        run: nix develop ".#devShells.$NIX_SHELL_SYSTEM.default" --no-update-lock-file --profile "$RUNNER_TEMP/nix-shell" --command true
      - name: Upload development shell closure
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          nix path-info --recursive "$RUNNER_TEMP/nix-shell" | cachix push codyps

  toml-fmt:
    name: TOML formatting
    runs-on: warbler-linux
    timeout-minutes: 5
    steps:
      - name: Install checkout dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # https://taplo.tamasfe.dev/cli/installation/binary.html
      - name: Install Taplo 0.10.0
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-linux-x86_64.gz \
            --output "$RUNNER_TEMP/taplo.gz"
          echo "8fe196b894ccf9072f98d4e1013a180306e17d244830b03986ee5e8eabeb6156  $RUNNER_TEMP/taplo.gz" | sha256sum --check
          gzip --decompress --stdout "$RUNNER_TEMP/taplo.gz" > "$RUNNER_TEMP/taplo"
          chmod +x "$RUNNER_TEMP/taplo"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # https://taplo.tamasfe.dev/cli/usage/formatting.html#check
      - run: taplo fmt --check

  fmt:
    name: Cargo fmt
    runs-on: warbler-linux
    timeout-minutes: 5
    steps:
      - name: Install checkout dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: warbler-linux
    timeout-minutes: 30
    environment: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'warbler-cache-main' || 'warbler-cache-read' }}
    env:
      WARBLER_CACHE_CREDENTIAL: ${{ secrets.WARBLER_CACHE_WRITE || secrets.WARBLER_CACHE_READ }}
    steps:
      - name: Install checkout dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - name: Install native build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends build-essential cmake pkg-config libssl-dev libsqlite3-dev
      - name: Configure Warbler compiler cache
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/mozilla/sccache/releases/download/v0.18.0/sccache-v0.18.0-x86_64-unknown-linux-musl.tar.gz \
            --output "$RUNNER_TEMP/sccache.tar.gz"
          echo "45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89  $RUNNER_TEMP/sccache.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/sccache.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/sccache-v0.18.0-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 .github/scripts/warbler_cache.py
      - run: cargo clippy --locked --workspace --all-targets
      - name: Compiler cache statistics
        if: always() && env.RUSTC_WRAPPER == 'sccache'
        run: sccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"

  test:
    name: Tests
    runs-on: warbler-linux
    timeout-minutes: 30
    environment: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'warbler-cache-main' || 'warbler-cache-read' }}
    env:
      WARBLER_CACHE_CREDENTIAL: ${{ secrets.WARBLER_CACHE_WRITE || secrets.WARBLER_CACHE_READ }}
    steps:
      - name: Install checkout dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install native build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends build-essential cmake pkg-config libssl-dev libsqlite3-dev
      - name: Configure Warbler compiler cache
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/mozilla/sccache/releases/download/v0.18.0/sccache-v0.18.0-x86_64-unknown-linux-musl.tar.gz \
            --output "$RUNNER_TEMP/sccache.tar.gz"
          echo "45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89  $RUNNER_TEMP/sccache.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/sccache.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/sccache-v0.18.0-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 .github/scripts/warbler_cache.py
      - run: cargo test --locked --workspace
      - name: Compiler cache statistics
        if: always() && env.RUSTC_WRAPPER == 'sccache'
        run: sccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"
