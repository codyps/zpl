name: Warbler GARM validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first:
    runs-on: warbler-linux
    timeout-minutes: 10
    outputs:
      hostname: ${{ steps.probe.outputs.hostname }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: probe
        run: |
          set -eu
          test -f Cargo.toml
          test ! -e /var/tmp/garm-job-sentinel
          echo "hostname=$(hostname)" >> "$GITHUB_OUTPUT"
          touch /var/tmp/garm-job-sentinel
          echo "Private checkout succeeded on $(hostname)"
          sleep 20
  parallel:
    runs-on: warbler-linux
    timeout-minutes: 10
    steps:
      - run: |
          set -eu
          test ! -e /var/tmp/garm-job-sentinel
          touch /var/tmp/garm-job-sentinel
          echo "Concurrent job on $(hostname)"
          sleep 20
  replacement:
    needs: [first, parallel]
    runs-on: warbler-linux
    timeout-minutes: 10
    env:
      FIRST_HOST: ${{ needs.first.outputs.hostname }}
    steps:
      - run: |
          set -eu
          test "$(hostname)" != "$FIRST_HOST"
          test ! -e /var/tmp/garm-job-sentinel
          echo "Fresh VM verified: $(hostname)"
