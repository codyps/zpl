# https://docs.github.com/en/actions/use-cases-and-examples/building-and-testing/building-and-testing-rust
name: CI

on:
  push:
    # Temporary release-plz branches duplicate main and release-PR checks.
    # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#onpushbranchestagsbranches-ignoretags-ignore
    branches:
      - '**'
      - '!release-plz-*-tmp-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_RETRY: 2
  CARGO_HTTP_TIMEOUT: 30

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-wheels:
    uses: ./.github/workflows/python-package.yml
    permissions:
      contents: read

  python:
    name: Python package (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # System Python 3.10 and 3.12 exercise the stable ABI floor and a newer interpreter.
        runner: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Build and test wheel
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends python3-dev python3-venv
          python3 -m venv "$RUNNER_TEMP/python-venv"
          . "$RUNNER_TEMP/python-venv/bin/activate"
          python -m pip install --retries 2 --timeout 30 'maturin>=1.15,<2'
          cargo test --locked -p zpl-python
          maturin build --locked --manifest-path zpl-python/Cargo.toml --out "$RUNNER_TEMP/wheels"
          python -m pip install --no-index "$RUNNER_TEMP"/wheels/*.whl
          python -m unittest discover -s zpl-python/tests -v
      - name: Rebuild and test source distribution
        run: |
          . "$RUNNER_TEMP/python-venv/bin/activate"
          maturin sdist --manifest-path zpl-python/Cargo.toml --out "$RUNNER_TEMP/sdist"
          python -m pip install --no-build-isolation --no-deps --force-reinstall "$RUNNER_TEMP"/sdist/*.tar.gz
          python -m unittest discover -s zpl-python/tests -v

  nix-shell:
    name: Cache Nix development shell (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: x86_64-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Determine Cachix write access
        id: cachix-access
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -n "$CACHIX_AUTH_TOKEN" ]; then
            echo 'can-push=true' >> "$GITHUB_OUTPUT"
          else
            echo 'can-push=false' >> "$GITHUB_OUTPUT"
            echo 'CACHIX_AUTH_TOKEN is unavailable; building with read-only cache access.'
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            download-attempts = 3
            connect-timeout = 15
            stalled-download-timeout = 60
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: codyps
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Cache completed derivations as they build, even if a later step fails.
          # https://github.com/cachix/cachix-action#push-modes
          skipPush: ${{ steps.cachix-access.outputs.can-push != 'true' }}
      - name: Build development shell
        # The profile retains the environment and its dependencies for upload.
        # print-dev-env builds the same environment without launching host Bash.
        # nix develop selects Bash from the primary (unstable) nixpkgs input,
        # which no longer supports Intel Darwin, then falls back to Bash 3.2.
        # https://nix.dev/manual/nix/2.28/command-ref/new-cli/nix3-print-dev-env.html
        env:
          NIX_SHELL_SYSTEM: ${{ matrix.system }}
        run: nix print-dev-env ".#devShells.$NIX_SHELL_SYSTEM.default" --accept-flake-config --no-update-lock-file --profile "$RUNNER_TEMP/nix-shell" > /dev/null
      - name: Upload development shell closure
        # Also include substituted dependencies, which do not trigger build hooks.
        if: steps.cachix-access.outputs.can-push == 'true'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          nix path-info --recursive "$RUNNER_TEMP/nix-shell" | cachix push codyps

  toml-fmt:
    name: TOML formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # https://taplo.tamasfe.dev/cli/installation/binary.html
      - name: Install Taplo 0.10.0
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-linux-x86_64.gz \
            --output "$RUNNER_TEMP/taplo.gz"
          echo "8fe196b894ccf9072f98d4e1013a180306e17d244830b03986ee5e8eabeb6156  $RUNNER_TEMP/taplo.gz" | sha256sum --check
          gzip --decompress --stdout "$RUNNER_TEMP/taplo.gz" > "$RUNNER_TEMP/taplo"
          chmod +x "$RUNNER_TEMP/taplo"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # https://taplo.tamasfe.dev/cli/usage/formatting.html#check
      - run: taplo fmt --check

  fmt:
    name: Cargo fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - name: Test registry release selection
        run: python3 -m unittest discover -s scripts -p 'test_*release.py' -v
      - name: Verify compact capture tables
        run: python3 zpl-bitmap-fonts/data/compile_captures.py --check
      - run: cargo fmt --all -- --check
      - run: rustfmt --edition 2021 --check benchmarks/harness.rs

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - name: Install native build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends build-essential cmake pkg-config libssl-dev libsqlite3-dev python3-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      - run: cargo clippy --locked --workspace --all-targets

  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install native build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends build-essential cmake pkg-config libssl-dev libsqlite3-dev python3-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      - run: cargo test --locked --workspace
