# Build/test with read-only repository access. Publication lives in release-plz.yml.
name: Swift package

on:
  workflow_call:
    inputs:
      version:
        description: Completed renderer release, or empty for ordinary CI
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  CARGO_NET_RETRY: 2
  CARGO_HTTP_TIMEOUT: 30

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            library: libCZpl.a
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            library: libCZpl.a
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            library: libCZpl.a
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            library: libCZpl.a
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            library: CZpl.lib
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            library: CZpl.lib
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install portable Linux build tools
        if: runner.os == 'Linux'
        run: python -m pip install --retries 2 --timeout 30 'cargo-zigbuild==0.23.4' 'ziglang==0.14.1'
      - name: Build static C ABI for Swift
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          NATIVE_LIBRARY: ${{ matrix.library }}
        run: python scripts/native-build.py zpl-c "$NATIVE_TARGET" "swift-native/$NATIVE_TARGET/$NATIVE_LIBRARY" --static
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-native-${{ matrix.target }}
          path: swift-native/
          if-no-files-found: error
          retention-days: 14

  build:
    needs: native
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: swift-native-*
          merge-multiple: true
          path: swift-native
      - name: Generate direct Rust parity fixtures
        run: cargo run --locked -p zpl-c --example swift_reference -- zpl-swift/Tests/ZPLTests/Fixtures
      - name: Build all Apple slices and stage distribution
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("zpl/Cargo.toml", "rb"))["package"]["version"])')
          if [ -n "$RELEASE_VERSION" ]; then test "$VERSION" = "$RELEASE_VERSION"; fi
          python3 scripts/swift-package.py build "$RUNNER_TEMP/swift-build"
          ASSET="$RUNNER_TEMP/swift-build/CZpl-$VERSION.xcframework.zip"
          NATIVE_ASSET="$RUNNER_TEMP/swift-build/CZpl-$VERSION.artifactbundle.zip"
          python3 scripts/swift-native.py pack "$VERSION" swift-native "$NATIVE_ASSET"
          python3 scripts/swift-package.py stage "$VERSION" "$ASSET" "$RUNNER_TEMP/local/zpl-swift" --local --native-artifact "$NATIVE_ASSET"
          python3 scripts/swift-package.py stage "$VERSION" "$ASSET" "$RUNNER_TEMP/remote/zpl-swift" --native-artifact "$NATIVE_ASSET"
          test "$(swift package compute-checksum "$NATIVE_ASSET")" = "$(python3 scripts/swift-native.py verify "$NATIVE_ASSET")"
          test "$(swift package compute-checksum "$ASSET")" = "$(python3 scripts/swift-package.py verify "$ASSET")"
          mkdir -p dist
          cp "$ASSET" "$NATIVE_ASSET" dist/
          tar -czf dist/swift-package.tar.gz -C "$RUNNER_TEMP/remote" zpl-swift
      - name: Test Swift wrapper against native Rust outputs
        run: swift test --package-path "$RUNNER_TEMP/local/zpl-swift"
      - name: Build and run independent consumer without Rust
        run: |
          mkdir -p "$RUNNER_TEMP/no-rust"
          for TOOL in cargo rustc; do
            printf '#!/bin/sh\nexit 99\n' > "$RUNNER_TEMP/no-rust/$TOOL"
            chmod +x "$RUNNER_TEMP/no-rust/$TOOL"
          done
          cp -R zpl-swift/Tests/Consumer "$RUNNER_TEMP/Consumer"
          export PATH="$RUNNER_TEMP/no-rust:$PATH"
          export ZPL_PACKAGE_PATH="$RUNNER_TEMP/local/zpl-swift"
          swift run --package-path "$RUNNER_TEMP/Consumer"
      - name: Build iOS device and run simulator tests
        run: |
          export ZPL_PACKAGE_PATH="$RUNNER_TEMP/local/zpl-swift"
          cd "$RUNNER_TEMP/Consumer"
          xcodebuild -scheme Consumer -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/ios-device" CODE_SIGNING_ALLOWED=NO build
          cd "$RUNNER_TEMP/local/zpl-swift"
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          xcodebuild -scheme ZPL -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath "$RUNNER_TEMP/ios-simulator" CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-package
          path: dist/
          if-no-files-found: error
          retention-days: 14

  intel:
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: swift-package
          path: dist
      - name: Test exact packaged Intel slice
        run: |
          mkdir -p "$RUNNER_TEMP/intel"
          tar -xzf dist/swift-package.tar.gz -C "$RUNNER_TEMP/intel"
          python3 scripts/swift-localize.py "$RUNNER_TEMP/intel/zpl-swift" dist
          swift test --package-path "$RUNNER_TEMP/intel/zpl-swift"

  desktop:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04-arm
          - runner: windows-2025
            arch: amd64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Select pinned Windows Swift toolchain paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The Windows installer can add the runtime while omitting the toolchain
          # from PATH. Set both before setup-swift validates the installation.
          $swiftRoot = Join-Path $env:LOCALAPPDATA 'Programs\Swift'
          @(
            "$swiftRoot\Toolchains\6.3.3+Asserts\usr\bin"
            "$swiftRoot\Runtimes\6.3.3\usr\bin"
          ) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5 # v0.4.0
        if: runner.os == 'Windows'
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE
          build_arch: ${{ matrix.arch }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: swift-package
          path: dist
      - name: Test exact packaged desktop library without Rust
        run: |
          python - <<'PYTHON'
          import os, tarfile
          from pathlib import Path
          destination = Path(os.environ['RUNNER_TEMP']) / 'swift-desktop'
          destination.mkdir(parents=True)
          with tarfile.open('dist/swift-package.tar.gz') as archive:
              archive.extractall(destination, filter='data')
          PYTHON
          python scripts/swift-localize.py "$RUNNER_TEMP/swift-desktop/zpl-swift" dist
          if [ "$RUNNER_OS" = Linux ]; then
            docker run --rm -v "$RUNNER_TEMP/swift-desktop:/test" -v "$PWD:/repo:ro" -w /test swift:6.3.3-noble bash -ec '
              swift test --package-path /test/zpl-swift
              cp -R /repo/zpl-swift/Tests/Consumer /test/Consumer
              export ZPL_PACKAGE_PATH=/test/zpl-swift
              swift run --package-path /test/Consumer
            '
          else
            swift test --package-path "$RUNNER_TEMP/swift-desktop/zpl-swift"
            cp -R zpl-swift/Tests/Consumer "$RUNNER_TEMP/swift-desktop/Consumer"
            export ZPL_PACKAGE_PATH="$RUNNER_TEMP/swift-desktop/zpl-swift"
            swift run --package-path "$RUNNER_TEMP/swift-desktop/Consumer"
          fi

  musl:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            triple: x86_64-swift-linux-musl
          - runner: ubuntu-24.04-arm
            triple: aarch64-swift-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: swift-package
          path: dist
      - name: Build static Swift SDK consumer and run on Alpine without Rust
        env:
          SWIFT_TRIPLE: ${{ matrix.triple }}
        run: |
          mkdir -p "$RUNNER_TEMP/swift-musl"
          tar -xzf dist/swift-package.tar.gz -C "$RUNNER_TEMP/swift-musl"
          python3 scripts/swift-localize.py "$RUNNER_TEMP/swift-musl/zpl-swift" dist
          docker run --rm -e SWIFT_TRIPLE -v "$RUNNER_TEMP/swift-musl:/test" -v "$PWD:/repo:ro" -w /test swift:6.3.3-noble bash -ec '
            swift sdk install https://download.swift.org/swift-6.3.3-release/static-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz --checksum 87c3eaf908e67c0e13a84367119e12273cec1d2cd3d81f7d74bb36722d6b607b
            cp -R /repo/zpl-swift/Tests/Consumer /test/Consumer
            export ZPL_PACKAGE_PATH=/test/zpl-swift
            swift build --package-path /test/Consumer --swift-sdk "$SWIFT_TRIPLE" -c release
            BIN=$(swift build --package-path /test/Consumer --swift-sdk "$SWIFT_TRIPLE" -c release --show-bin-path)
            cp "$BIN/Consumer" /test/Consumer-static
          '
          docker run --rm -v "$RUNNER_TEMP/swift-musl:/test:ro" alpine:3.22 /test/Consumer-static
