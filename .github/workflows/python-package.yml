# Build/test jobs have no publishing identity; PyPI upload stays in release-plz.yml.
name: Python distributions

on:
  workflow_call:
    inputs:
      version:
        description: Completed stable renderer version; empty for ordinary CI builds
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  CARGO_NET_RETRY: 2
  CARGO_HTTP_TIMEOUT: 30

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            compatibility: manylinux_2_28
            image: quay.io/pypa/manylinux_2_28_x86_64
            docker-platform: linux/amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
            compatibility: manylinux_2_28
            image: quay.io/pypa/manylinux_2_28_aarch64
            docker-platform: linux/arm64
          - runner: ubuntu-24.04
            target: armv7-unknown-linux-gnueabihf
            platform: linux-armv7
            compatibility: manylinux_2_28
            image: quay.io/pypa/manylinux_2_31_armv7l
            docker-platform: linux/arm/v7
          - runner: ubuntu-24.04
            target: riscv64gc-unknown-linux-gnu
            platform: linux-riscv64
            compatibility: manylinux_2_39
            image: quay.io/pypa/manylinux_2_39_riscv64
            docker-platform: linux/riscv64
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: musl-x86_64
            compatibility: musllinux_1_2
            image: python:3.13-alpine
            docker-platform: linux/amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: musl-aarch64
            compatibility: musllinux_1_2
            image: python:3.13-alpine
            docker-platform: linux/arm64
          - runner: ubuntu-24.04
            target: armv7-unknown-linux-musleabihf
            platform: musl-armv7
            compatibility: musllinux_1_2
            image: python:3.13-alpine
            docker-platform: linux/arm/v7
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
            compatibility: pypi
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
            compatibility: pypi
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            compatibility: pypi
          - runner: windows-2025
            target: i686-pc-windows-msvc
            platform: windows-x86
            compatibility: pypi
            python-arch: x86
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows-arm64
            compatibility: pypi
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python-arch || (runner.arch == 'ARM64' && 'arm64' || 'x64') }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Stamp Python version and install build tools
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            python scripts/python-release.py stamp "$RELEASE_VERSION"
          fi
          python -m pip install --retries 2 --timeout 30 'maturin==1.15.0' 'twine>=6,<7'
          if [ "$RUNNER_OS" = Linux ]; then
            python -m pip install --retries 2 --timeout 30 'ziglang==0.14.1'
          fi
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Materialize license files on Windows
        if: runner.os == 'Windows'
        # Git on Windows can check out symlinks as their target-path text.
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          license_text = Path("LICENSE").read_bytes()
          for crate in ("zpl-python", "zpl", "zpl-bitmap-fonts", "raster-diff"):
              license_file = Path(crate) / "LICENSE"
              license_file.unlink()
              license_file.write_bytes(license_text)
          PYTHON
      - name: Build release wheel
        env:
          WHEEL_TARGET: ${{ matrix.target }}
          WHEEL_COMPATIBILITY: ${{ matrix.compatibility }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            if [[ "$WHEEL_TARGET" == *musl* ]]; then export RUSTFLAGS='-C target-feature=-crt-static'; fi
            maturin build --locked --release --manifest-path zpl-python/Cargo.toml --out dist --zig --target "$WHEEL_TARGET" --compatibility "$WHEEL_COMPATIBILITY"
          else
            maturin build --locked --release --manifest-path zpl-python/Cargo.toml --out dist --target "$WHEEL_TARGET" --compatibility pypi
          fi
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm,riscv64
        if: matrix.docker-platform == 'linux/arm/v7' || matrix.docker-platform == 'linux/riscv64'
      - name: Test installed wheel on target Linux libc and architecture
        if: runner.os == 'Linux'
        env:
          CONSUMER_IMAGE: ${{ matrix.image }}
          CONSUMER_PLATFORM: ${{ matrix.docker-platform }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          docker run --rm --platform "$CONSUMER_PLATFORM" -e RELEASE_VERSION -v "$PWD:/work" -w /work "$CONSUMER_IMAGE" sh -ec '
            if [ -x /opt/python/cp310-cp310/bin/python ]; then export PATH=/opt/python/cp310-cp310/bin:$PATH; fi
            python -m pip install --no-index --only-binary=:all: dist/*.whl
            python -m unittest discover -s zpl-python/tests -v
            if [ -n "$RELEASE_VERSION" ]; then
              python -c "import os, zplkit; assert zplkit.__version__ == zplkit.library_version == os.environ[\"RELEASE_VERSION\"]"
            fi
          '
      - name: Test installed wheel and linked renderer version
        if: runner.os != 'Linux'
        run: |
          python -m pip install --no-index --only-binary=:all: dist/*.whl
          python -m unittest discover -s zpl-python/tests -v
          if [ -n "$RELEASE_VERSION" ]; then
            python -c 'import os, zplkit; assert zplkit.__version__ == zplkit.library_version == os.environ["RELEASE_VERSION"]'
          fi
      - name: Build and test source distribution
        if: matrix.platform == 'linux-x86_64'
        run: |
          maturin sdist --manifest-path zpl-python/Cargo.toml --out dist
          python -m pip install --no-build-isolation --no-deps --force-reinstall dist/*.tar.gz
          python -m unittest discover -s zpl-python/tests -v
          if [ -n "$RELEASE_VERSION" ]; then
            python -c 'import os, zplkit; assert zplkit.__version__ == zplkit.library_version == os.environ["RELEASE_VERSION"]'
          fi
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
