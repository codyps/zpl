[workspace]
members = [
    "zebra-firmware",
    "zpl-font-extract",
    "raster-diff",
    "zpl-wasm",
    "zpl",
    "zebra-http-api",
    "zpl-proxy-api",
]

resolver = "2"

[workspace.package]
license = "OSL-3.0"

[workspace.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = [
    "http2",
    "charset",
    "hickory-dns",
    "rustls",
] }

# Pixel loops, PNG decoding and provenance hashes dominate native raster tests.
# Keep validation enabled while optimizing the test harness and its dependencies.
# https://doc.rust-lang.org/cargo/reference/profiles.html#test
[profile.test]
opt-level = 1
debug-assertions = true
overflow-checks = true
