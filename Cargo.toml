[workspace]
members = [
    "zebra-firmware",
    "zpl-font-extract",
    "raster-diff",
    "zpl-wasm",
    "zpl",
    "zebra-http-api",
    "zpl-proxy-api",
]

resolver = "2"

[workspace.package]
license = "OSL-3.0"

[workspace.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = [
    "http2",
    "charset",
    "hickory-dns",
    "rustls",
] }
