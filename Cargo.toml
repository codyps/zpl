[workspace]
members = [
    "raster-diff",
    "zpl-wasm",
	"zpl",
	"zebra-http-api", "zpl-proxy-api",
]

resolver = "2"

[workspace.package]
license = "OSL-3.0"

[workspace.dependencies]
reqwest = { version = "0.12.7", default-features = false, features = ["http2", "charset", "hickory-dns", "rustls-tls-webpki-roots"] }
