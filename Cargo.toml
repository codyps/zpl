[workspace]
members = [
    "zebra-firmware",
    "zebra-sgd",
    "zpl-font-extract",
    "zpl-bitmap-fonts",
    "raster-diff",
    "zpl-wasm",
    "zpl-python",
    "zpl-cmd",
    "zpl-render-api",
    "zpl",
    "zebra-http-api",
    "zpl-proxy-api",
]

resolver = "2"

[workspace.package]
license = "OSL-3.0"

[workspace.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = [
    "http2",
    "charset",
    "hickory-dns",
    "rustls",
] }

# Retain file/line backtraces without generating full type and variable debug info.
# Tests inherit this setting; use --profile debugging for debugger sessions.
# https://doc.rust-lang.org/cargo/guide/build-performance.html#reduce-amount-of-generated-debug-information
[profile.dev]
debug = "line-tables-only"

# Use a custom name for compatibility with Cargo versions before 1.99.
[profile.debugging]
inherits = "dev"
debug = "full"

# Pixel loops, PNG decoding and provenance hashes dominate native raster tests.
# Keep validation enabled while optimizing the test harness and its dependencies.
# https://doc.rust-lang.org/cargo/reference/profiles.html#test
[profile.test]
opt-level = 1
debug-assertions = true
overflow-checks = true
