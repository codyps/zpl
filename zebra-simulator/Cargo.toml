[package]
name = "zebra-simulator"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Network Zebra printer simulator with persistent live request history"
publish = false

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
diesel = { version = "2.3.13", features = ["sqlite"] }
diesel_migrations = { version = "2.3.2", features = ["sqlite"] }
eyre = "0.6.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
futures-util = "0.3.32"
zebra-sgd-parser = { path = "../zebra-sgd-parser" }
zpl = { version = "0.2.0", path = "../zpl" }

[dev-dependencies]
tempfile = "3.27.0"
reqwest = { workspace = true, features = ["json", "form", "query"] }
zebra-sgd = { path = "../zebra-sgd" }
zebra-http-api = { path = "../zebra-http-api" }
