[package]
name = "zpl-font-extract"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[dependencies]
eyre = "0.6.14"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { workspace = true }
zebra-http-api = { path = "../zebra-http-api" }
zpl-bitmap-fonts = { path = "../zpl-bitmap-fonts" }
raster-diff = { version = "0.1.1", path = "../raster-diff" }
