[package]
name = "zpl-python"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false
description = "Python bindings for the local ZPL parser and renderer"
repository = "https://github.com/codyps/zpl"
readme = "README.md"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29.3", features = ["abi3-py310"] }
zpl = { version = "0.2.1", path = "../zpl" }
